<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PiVis</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #111; color: #eee; font-family: monospace; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 1rem; }
    h1 { font-size: 1.2rem; margin-bottom: 0.75rem; letter-spacing: 0.1em; color: #0f0; }
    #stream-wrap { position: relative; width: 100%; max-width: 900px; }
    #stream { width: 100%; display: block; border: 1px solid #333; }
    #overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
    #status-bar { display: flex; gap: 1rem; margin-top: 0.5rem; font-size: 0.8rem; flex-wrap: wrap; }
    .badge { padding: 0.2rem 0.6rem; border-radius: 4px; background: #222; }
    .badge.green { background: #0a2a0a; color: #0f0; }
    .badge.red { background: #2a0a0a; color: #f55; }
    #last-greeting { font-style: italic; color: #aaa; margin-top: 0.4rem; font-size: 0.85rem; }
    button { background: #222; color: #eee; border: 1px solid #444; padding: 0.2rem 0.6rem; border-radius: 4px; cursor: pointer; font-family: monospace; }
    button:hover { background: #333; }
  </style>
</head>
<body>
  <h1>PiVis</h1>
  <div id="stream-wrap">
    <video id="stream" autoplay muted playsinline></video>
    <canvas id="overlay"></canvas>
  </div>
  <div id="status-bar">
    <span id="badge-person" class="badge">no person</span>
    <span id="badge-stream" class="badge">stream: connecting</span>
    <span id="badge-listener" class="badge">audio: connecting</span>
  </div>
  <div id="last-greeting"></div>
  <div style="margin-top:0.6rem;display:flex;gap:0.5rem;align-items:center;font-size:0.8rem;flex-wrap:wrap;">
    <span style="color:#888">Light:</span>
    <button onclick="setLighting('daylight')">&#9728; Daylight</button>
    <button onclick="setLighting('indoor')">&#128161; Indoor</button>
    <button onclick="setLighting('dim')">&#127769; Dim</button>
    <span id="lighting-status" style="color:#888"></span>
  </div>
  <audio id="audio-player" autoplay></audio>

  <script>
    const video   = document.getElementById('stream');
    const canvas  = document.getElementById('overlay');
    const ctx     = canvas.getContext('2d');
    const badgePerson   = document.getElementById('badge-person');
    const badgeStream   = document.getElementById('badge-stream');
    const badgeListener = document.getElementById('badge-listener');
    const lastGreeting  = document.getElementById('last-greeting');
    const player        = document.getElementById('audio-player');

    // --- MediaSource / WebSocket stream ---
    // The stream's PTS base is arbitrary (ffmpeg wall-clock, starts at ~hundreds
    // of seconds), so we can't assume playback begins at 0 — we seek to the live
    // buffered edge whenever the playhead is outside the buffered range.
    const ms = new MediaSource();
    video.src = URL.createObjectURL(ms);
    let sb, sbQueue = [], sbBusy = false;

    const LIVE_LATENCY = 0.15;  // seconds of buffer to keep behind the live edge
    function syncToLiveEdge() {
      if (!sb || !sb.buffered.length) return;
      const start = sb.buffered.start(0), end = sb.buffered.end(0);
      // Seek if playhead is outside buffered range or lagging >0.8s behind live.
      if (video.currentTime < start || video.currentTime > end + 0.3 || end - video.currentTime > 0.8) {
        try { video.currentTime = Math.max(start, end - LIVE_LATENCY); } catch (_) {}
      }
      // Nudge playback rate up slightly when drifting behind to catch up smoothly.
      video.playbackRate = (end - video.currentTime > 0.4) ? 1.1 : 1.0;
      if (video.paused) video.play().catch(() => {});
    }

    function sbDrain() {
      if (sbBusy || !sbQueue.length || !sb || sb.updating) return;
      sbBusy = true;
      sb.addEventListener('updateend', () => {
        sbBusy = false;
        syncToLiveEdge();
        sbDrain();
      }, { once: true });
      try { sb.appendBuffer(sbQueue.shift()); } catch(e) { console.error('appendBuffer:', e); sbBusy = false; }
    }

    ms.addEventListener('sourceopen', () => {
      const codec = 'video/mp4; codecs="avc1.640032"';
      if (!MediaSource.isTypeSupported(codec)) {
        console.error('Codec not supported:', codec);
        badgeStream.textContent = 'stream: codec unsupported';
        badgeStream.className = 'badge red';
        return;
      }
      sb = ms.addSourceBuffer(codec);
      sb.addEventListener('error', e => console.error('SourceBuffer error:', e));
      // Drain any data that arrived before sourceopen fired
      sbDrain();
      // Evict old buffered data every 10s to bound memory / keep latency low
      setInterval(() => {
        if (!sb || sb.updating || !sb.buffered.length) return;
        const end = sb.buffered.end(0), start = sb.buffered.start(0);
        if (end - start > 30) {
          try { sb.remove(start, end - 10); } catch(_) {}
        }
      }, 10_000);
    });
    ms.addEventListener('error', e => console.error('MediaSource error:', e));
    video.addEventListener('error', e => console.error('Video error:', video.error?.message, e));
    // If the browser stalls (waiting), nudge back to the live edge.
    video.addEventListener('waiting', syncToLiveEdge);

    let ws;
    function connectStream() {
      ws = new WebSocket('ws://' + location.host + '/ws/stream');
      ws.binaryType = 'arraybuffer';
      ws.onopen = () => {
        badgeStream.textContent = 'stream: live';
        badgeStream.className = 'badge green';
      };
      ws.onmessage = e => {
        // Always queue — sbDrain guards against !sb (before sourceopen)
        sbQueue.push(e.data);
        sbDrain();
      };
      ws.onclose = () => {
        badgeStream.textContent = 'stream: reconnecting';
        badgeStream.className = 'badge red';
        setTimeout(connectStream, 1500);
      };
    }
    connectStream();

    // --- Detection overlay ---
    // The video PTS clock and the sensor-timestamp clock have different origins,
    // so we draw the latest detection immediately (≈150ms behind the frame) and
    // fade it out when detections stop, rather than trying to PTS-match.
    let lastBoxTime = 0;

    function drawBoxes(boxes) {
      const W = canvas.width, H = canvas.height;
      ctx.clearRect(0, 0, W, H);
      ctx.strokeStyle = '#0f0';
      ctx.lineWidth = 2;
      ctx.font = '12px monospace';
      ctx.fillStyle = '#0f0';
      for (const b of boxes) {
        const x = b.x1 * W, y = b.y1 * H;
        const w = (b.x2 - b.x1) * W, h = (b.y2 - b.y1) * H;
        ctx.strokeRect(x, y, w, h);
        ctx.fillText((b.confidence * 100).toFixed(0) + '%', x + 2, y - 4);
      }
      lastBoxTime = performance.now();
    }

    // Keep canvas dimensions synced to video display size
    const ro = new ResizeObserver(() => {
      canvas.width  = video.clientWidth;
      canvas.height = video.clientHeight;
    });
    ro.observe(video);

    // Clear stale boxes 600ms after the last detection
    function render() {
      if (performance.now() - lastBoxTime > 600) {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
      }
      requestAnimationFrame(render);
    }
    requestAnimationFrame(render);

    // --- SSE ---
    const sse = new EventSource('/events');
    sse.addEventListener('detection', e => {
      const d = JSON.parse(e.data);
      badgePerson.textContent = d.has_person ? 'person detected' : 'no person';
      badgePerson.className = 'badge' + (d.has_person ? ' green' : '');
      if (d.has_person && d.boxes.length) drawBoxes(d.boxes);
    });
    sse.addEventListener('audio', e => {
      const { wav_url, text } = JSON.parse(e.data);
      player.src = wav_url;
      player.play().catch(() => {});
      lastGreeting.textContent = '"' + text + '"';
    });
    sse.onerror = () => {
      badgeListener.textContent = 'audio: disconnected';
      badgeListener.className = 'badge red';
    };
    sse.onopen = () => {
      badgeListener.textContent = 'audio: connected';
      badgeListener.className = 'badge green';
    };

    // --- Status poll ---
    async function pollStatus() {
      try {
        const data = await fetch('/status').then(r => r.json());
        if (data.sse_client_count === 0) {
          badgeListener.textContent = 'audio: no listener';
          badgeListener.className = 'badge red';
        }
      } catch (_) {}
    }
    setInterval(pollStatus, 2000);

    // --- Lighting ---
    async function setLighting(preset) {
      const s = document.getElementById('lighting-status');
      s.textContent = 'applying...';
      try {
        await fetch('/settings/lighting/' + preset, { method: 'POST' });
        s.textContent = '&#10003; ' + preset;
      } catch(_) { s.textContent = 'failed'; }
    }
  </script>
</body>
</html>
