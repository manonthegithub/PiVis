<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>PiVis Audio Module</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 3rem auto; padding: 0 1rem; }
    button { font-size: 1rem; padding: 0.6rem 1.2rem; margin-right: 0.5rem; }
    #status { color: #666; margin: 1rem 0; }
    #log { border: 1px solid #ccc; border-radius: 6px; padding: 1rem; min-height: 200px; white-space: pre-wrap; }
    .err { color: #b00020; }
  </style>
</head>
<body>
  <h1>PiVis Audio Module</h1>
  <p>Speech-to-text only for now &mdash; talk, pause, and the transcribed phrase appears below.</p>
  <div>
    <button id="startBtn">Start</button>
    <button id="stopBtn" disabled>Stop</button>
  </div>
  <div id="status">idle</div>
  <div id="log"></div>

  <script src="/static/audio-client.js"></script>
  <script>
    const statusEl = document.getElementById("status");
    const logEl = document.getElementById("log");
    const startBtn = document.getElementById("startBtn");
    const stopBtn = document.getElementById("stopBtn");

    function log(text, isError) {
      const line = document.createElement("div");
      if (isError) line.className = "err";
      line.textContent = `[${new Date().toLocaleTimeString()}] ${text}`;
      logEl.prepend(line);
    }

    let client = null;

    startBtn.onclick = async () => {
      client = new AudioClient({
        onConnected: () => { statusEl.textContent = "recording"; },
        onError: (msg) => log(String(msg), true),
        onTranscription: (msg) => {
          statusEl.textContent = "recording";
          log(msg.text || "(empty)");
        },
        // Whisper transcription can take tens of seconds on this hardware --
        // without this, that wait looks identical to the page being frozen.
        onProcessing: () => { statusEl.textContent = "transcribing…"; },
        // A dropped connection (server restart, network blip) used to kill
        // the stream for good with no way back short of reloading the page.
        onReconnecting: (attempt, max) => {
          statusEl.textContent = `reconnecting… (${attempt}/${max})`;
          log(`Connection lost, reconnecting (attempt ${attempt}/${max})…`, true);
        },
        onReconnected: () => {
          statusEl.textContent = "recording";
          log("Reconnected.");
        },
        onReconnectFailed: () => {
          statusEl.textContent = "disconnected";
          log("Reconnect attempts exhausted -- click Start to try again.", true);
          startBtn.disabled = false;
          stopBtn.disabled = true;
        },
      });
      try {
        await client.initialize();
        client.start();
        startBtn.disabled = true;
        stopBtn.disabled = false;
      } catch (e) {
        statusEl.textContent = "error";
        log(String(e), true);
      }
    };

    stopBtn.onclick = () => {
      if (client) client.disconnect();
      statusEl.textContent = "idle";
      startBtn.disabled = false;
      stopBtn.disabled = true;
    };
  </script>
</body>
</html>
