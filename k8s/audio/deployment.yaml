apiVersion: apps/v1
kind: Deployment
metadata:
  name: pivis-audio
  namespace: pivis
  labels:
    app: pivis-audio
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pivis-audio
  template:
    metadata:
      labels:
        app: pivis-audio
    spec:
      # Only needed while the ghcr.io/<owner>/pivis/audio package is
      # private. Existing cluster secret `ghcr-secret` must exist in the
      # `pivis` namespace (Secrets are namespace-scoped — copy/recreate it
      # here if it currently lives elsewhere), or delete this block once
      # the package's visibility is set to public in GitHub.
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: audio
          image: ghcr.io/manonthegithub/pivis/audio:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: pivis-audio-config
          resources:
            requests:
              cpu: 250m
              memory: 768Mi
            limits:
              # Whisper transcription is CPU-bound; capping at 1 core made a
              # single real phrase take ~40s pinned at 100% (confirmed live)
              # with the receive loop blocked the whole time, looking like a
              # hang. Node (babka) has 4 cores with only 2 allocated as
              # limits cluster-wide, so there's real headroom for this.
              cpu: "2"
              # Confirmed live: OOMKilled (exit 137) after ~9 min running the
              # "small" model -- its footprint plus beam_size=5 decoding
              # apparently spikes past 1Gi on some segments (tiny stayed
              # comfortably under it). Node has 16GB with only 17% of memory
              # allocated as limits cluster-wide, so there's real headroom;
              # doubling rather than nudging since "large" may get tried too.
              memory: 2Gi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
