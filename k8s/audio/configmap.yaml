apiVersion: v1
kind: ConfigMap
metadata:
  name: pivis-audio-config
  namespace: pivis
  # NOTE: this k3s deployment is a fallback as of 2026-09-04 -- the primary
  # audio module now runs on zhuchka (/opt/pivis-audio/docker-compose.yml,
  # nginx's pivis-aud.apps.arpa vhost points there), CPU inference alone is
  # ~25x faster there. See MEMORY.md for the full migration writeup.
data:
  # Must be one of the sizes baked into the image (see Dockerfile.audio's
  # WHISPER_MODELS_TO_BAKE build arg, currently "tiny base small") --
  # HF_HUB_OFFLINE=1 means an uncached size fails to load rather than
  # downloading at startup. To switch: edit this value, then
  # `kubectl rollout restart deployment/pivis-audio -n pivis`. No rebuild
  # needed as long as the size is already baked in. Measured on this
  # hardware (ARM, int8, clean/no-contention runs): tiny ~0.6-0.9s/phrase,
  # small ~7.5s/phrase, base ~21-22s/phrase -- base is *slower* than small
  # despite being the smaller model, reproducible across repeated clean
  # runs; likely CTranslate2's int8 kernels vectorizing less favorably for
  # base's specific layer shapes on this ARM CPU. small currently looks
  # like the best accuracy/speed tradeoff of the three.
  WHISPER_MODEL: "small"
  # Silence duration (ms) that closes out a phrase as a sentence boundary.
  # Was 300ms (split long sentences into too many segments); tried 600ms,
  # user reported it made accuracy worse (likely more in-segment silence
  # for whisper to occasionally hallucinate over). 450ms is a middle
  # ground -- tune here without a rebuild if it's still not right.
  MIN_SILENCE_DURATION_MS: "450"
  # whisper's own default is 5; lower is faster but less accurate (1 is
  # greedy decoding), higher is slower but more accurate.
  BEAM_SIZE: "5"
