name: Build & push audio image

on:
  push:
    branches: [main]
    paths:
      - "pivis/audio/**"
      - "pivis/audio_app.py"
      - "pivis/__init__.py"
      - "pivis/web/static/**"
      - "requirements-audio.txt"
      - "Dockerfile.audio"
      - ".github/workflows/docker-build.yml"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # GHCR image refs must be lowercase; github.repository preserves case.
      - name: Compute image name
        run: echo "IMAGE_NAME=$(echo '${{ github.repository }}/audio' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=ref,event=branch

      # cache-from/to type=gha persists Docker layer cache in the GitHub
      # Actions cache between runs, so unchanged layers (deps, baked Whisper
      # model) are reused instead of rebuilt on every push.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.audio
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            WHISPER_MODEL=tiny
